[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zip-name-audit"
version = "0.1.0"
description = "Offline ZIP filename portability and collision preflight without extraction."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
zip-name-audit = "zip_name_audit.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/zip-name-audit"
Issues = "https://github.com/KanadeK/zip-name-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
